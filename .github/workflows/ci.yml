name: VORAX core CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Home library
        run: python scripts/verify_library.py
      - name: Run unit and cross-child tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q vorax scripts kaggle/child

      - name: Build portable child container
        run: docker build --tag revelacode-vorax:ci .
