name: Deploy VORAX Child to Hugging Face
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade huggingface_hub
      - name: Deploy Docker Space source
        env:
          HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
        run: |
          test -n "$HF_SPACE_TOKEN"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ["HF_SPACE_TOKEN"])
          repo="musombi123/revelacode-vorax-child"
          api.create_repo(repo_id=repo,repo_type="space",space_sdk="docker",private=True,exist_ok=True)
          api.upload_folder(repo_id=repo,repo_type="space",folder_path=".",
            ignore_patterns=[".git/**","data/**","reports/**",".env*","tests/**","revelacode-frontend/**","hf-model/**","**/__pycache__/**"],
            commit_message="Deploy VORAX Child shared runtime")
          print("Source deployed; verify hardware and runtime health in Space settings.")
          PY
