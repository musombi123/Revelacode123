name: Deploy VORAX Backup Child to Hugging Face

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --upgrade huggingface_hub

      - name: Deploy Docker Space source to the exact HF owner/repository
        env:
          HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
        run: |
          test -n "$HF_SPACE_TOKEN" || { echo 'Missing HF_SPACE_TOKEN'; exit 1; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_SPACE_TOKEN"])
          repo = "Musombi/revelacode-vorax-child"
          api.create_repo(repo_id=repo, repo_type="space", space_sdk="docker", private=True, exist_ok=True)
          api.upload_folder(
              repo_id=repo,
              repo_type="space",
              folder_path=".",
              ignore_patterns=[".git/**", "data/**", "reports/**", ".env*", "tests/**",
                               "revelacode-frontend/**", "hf-model/**", "**/__pycache__/**"],
              commit_message="Deploy canonical VORAX shared runtime",
          )
          print("Source upload completed. Live Space health and GPU must be checked separately.")
          PY
