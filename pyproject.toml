[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revelacode-legend"
version = "0.1.0"
description = "Deterministic T-Lang template composition and Home/Child research engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
legend = "legend.cli:main"

[tool.setuptools.packages.find]
include = ["legend*"]
