services:
  - type: web
    name: revelacode-legend-child
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn legend_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: LEGEND_HOME_REPO
        value: musombi123/Revelacode123
      - key: LEGEND_HOME_BRANCH
        value: main
      - key: LEGEND_CHILD_ID
        value: legend-child-01
      - key: LEGEND_DB_PATH
        value: data/legend.sqlite3
      - key: LEGEND_CHILD_API_KEY
        sync: false
      - key: LEGEND_ADMIN_API_KEY
        sync: false
      - key: LEGEND_GITHUB_TOKEN
        sync: false
      - key: LEGEND_TEACHER_API_KEY
        sync: false
      - key: LEGEND_TEACHER_MODEL
        sync: false
      - key: LEGEND_TEACHER_BASE_URL
        value: https://api.openai.com/v1
